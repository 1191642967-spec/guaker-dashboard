// 数据清洗
function cleanData(arr) {
  return arr.map(r => {
    const row = {...r};
    ['interactionRateCount','interactionRateUser','exposureToWatchRate','watchToProductRate','productClickRate','clickToBuyRate','refundRate'].forEach(k => {
      if (row[k] !== null && row[k] !== undefined && !isNaN(row[k])) {
        if (row[k] > 1) row[k] = row[k] / 100;
        if (row[k] > 1 || row[k] < 0) row[k] = null;
      }
    });
    return row;
  });
}

// 工具函数
const fmt = {
  money: v => v ? '¥' + Number(v).toLocaleString('zh-CN', {maximumFractionDigits:0}) : '-',
  num: v => v !== null && v !== undefined ? Number(v).toFixed(2) : '-',
  int: v => v ? Number(v).toLocaleString('zh-CN', {maximumFractionDigits:0}) : '-',
  pct: v => v !== null && v !== undefined ? (Number(v)*100).toFixed(2) + '%' : '-',
  date: v => v || '-',
  shortDate: v => v ? v.slice(5) : '-'
};

function sum(arr, key) { return arr.reduce((s,r) => s + (Number(r[key]) || 0), 0); }
function avg(arr, key) { const vals = arr.filter(r => r[key] !== null && r[key] !== undefined && !isNaN(r[key])); return vals.length ? vals.reduce((s,r) => s + Number(r[key]), 0) / vals.length : 0; }

// ==================== SVG漏斗图 ====================
function renderSvgFunnel(containerId, rawVals) {
  const container = document.getElementById(containerId);
  if (!rawVals.length || !rawVals[0].value) { container.innerHTML = '<div class="text-center text-slate-400 py-12 text-sm">暂无数据</div>'; return; }
  const W = 640, H = 400;
  const leftPad = 110, rightPad = 110;
  const funnelW = W - leftPad - rightPad;
  const n = rawVals.length;
  const gap = 10;
  const layerH = (H - 60 - gap*(n-1)) / n;
  const topY = 30;
  const widthRatios = [1.0, 0.78, 0.60, 0.44, 0.28];
  const widths = rawVals.map((_,i) => funnelW * (widthRatios[i] || 0.28));
  const colors = ['#3b5bdb','#4263eb','#4c6ef5','#5c7cfa','#748ffc'];
  const gid = containerId.replace(/[^a-zA-Z0-9]/g, '');
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;font-family:inherit">';
  svg += '<defs>';
  colors.forEach((c,i) => {
    svg += '<linearGradient id="fg_' + gid + '_' + i + '" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="' + c + '" stop-opacity="0.9"/><stop offset="100%" stop-color="' + c + '"/></linearGradient>';
  });
  svg += '<marker id="arrow_' + gid + '" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>';
  svg += '</defs>';
  for (let i = 0; i < n; i++) {
    const w1 = widths[i];
    const w2 = i < n-1 ? widths[i+1] : widths[i] * 0.85;
    const y1 = topY + i*(layerH+gap);
    const y2 = y1 + layerH;
    const x1l = leftPad + (funnelW - w1)/2;
    const x1r = leftPad + (funnelW + w1)/2;
    const x2l = leftPad + (funnelW - w2)/2;
    const x2r = leftPad + (funnelW + w2)/2;
    const midY = (y1+y2)/2;
    svg += '<polygon points="' + x1l + ',' + y1 + ' ' + x1r + ',' + y1 + ' ' + x2r + ',' + y2 + ' ' + x2l + ',' + y2 + '" fill="url(#fg_' + gid + '_' + i + ')"/>';
    svg += '<text x="15" y="' + (midY-4) + '" text-anchor="start" fill="#1e293b" font-size="13" font-weight="700">' + rawVals[i].name + '</text>';
    svg += '<text x="15" y="' + (midY+12) + '" text-anchor="start" fill="#64748b" font-size="11" font-weight="600">' + rawVals[i].value.toLocaleString() + ' 人</text>';
    const cx = (x1l + x2l + x1r + x2r) / 4;
    svg += '<text x="' + cx + '" y="' + (midY+1) + '" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">' + rawVals[i].value.toLocaleString() + '</text>';
    if (i > 0) {
      const rate = rawVals[i].value / rawVals[i-1].value;
      const boxX = W - 95;
      const boxW = 80;
      const boxH = 34;
      const boxY = midY - boxH/2;
      svg += '<rect x="' + boxX + '" y="' + boxY + '" width="' + boxW + '" height="' + boxH + '" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>';
      svg += '<text x="' + (boxX+boxW/2) + '" y="' + (midY-1) + '" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="bold">' + (rate*100).toFixed(1) + '%</text>';
      svg += '<text x="' + (boxX+boxW/2) + '" y="' + (midY+13) + '" text-anchor="middle" fill="#64748b" font-size="10" font-weight="500">转化率</text>';
      const prevY = topY + (i-1)*(layerH+gap) + layerH;
      svg += '<line x1="' + (x2r+5) + '" y1="' + prevY + '" x2="' + (boxX-8) + '" y2="' + (midY-10) + '" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow_' + gid + ')"/>';
    }
  }
  const overallRate = rawVals[n-1].value / rawVals[0].value;
  const bottomY = H - 12;
  svg += '<rect x="' + (W/2-90) + '" y="' + (bottomY-20) + '" width="180" height="26" rx="13" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>';
  svg += '<text x="' + (W/2) + '" y="' + (bottomY-3) + '" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="bold">曝光→成交 整体 ' + (overallRate*100).toFixed(2) + '%</text>';
  svg += '</svg>';
  container.innerHTML = svg;
}

function renderMonthlyBizCards(date) {
  const month = date ? date.slice(0, 7) : '';
  const monthData = DAILY.filter(r => r.date.startsWith(month));
  const daysInMonth = new Date(parseInt(month.slice(0,4)), parseInt(month.slice(5,7)), 0).getDate();
  const currentDay = parseInt(date.slice(8,10));
  const timeProgress = (currentDay / daysInMonth * 100).toFixed(1);
  
  document.getElementById('bizMonthLabel').textContent = month + '月（共' + daysInMonth + '天）';
  
  const totalGmv = sum(monthData, 'totalGmv');
  const totalSpend = sum(monthData, 'adSpend');
  const totalRoi = totalSpend > 0 ? totalGmv / totalSpend : 0;
  
  // 从localStorage读取目标
  let targets = {};
  try { targets = JSON.parse(localStorage.getItem('bizTargets') || '{}'); } catch(e) {}
  const defaultTargets = { gmv: 1000000, spend: 500000, roi: 2.0 };
  
  const cards = [
    { key:'gmv', label:'本月GMV', value:fmt.money(totalGmv), target:targets.gmv || defaultTargets.gmv, unit:'万', targetDiv:10000, color:'#003087' },
    { key:'spend', label:'本月消耗', value:fmt.money(totalSpend), target:targets.spend || defaultTargets.spend, unit:'万', targetDiv:10000, color:'#c8102e' },

function renderWeekRank() {
  const select = document.getElementById('weekRankSelect');
  const dates = [...new Set(ANCHOR.filter(r => r.date).map(r => r.date))].sort();
  
  // 生成周选项
  const weeks = [];
  const weekSet = new Set();
  dates.forEach(d => {
    const dt = new Date(d);
    const day = dt.getDay() || 7;
    const monday = new Date(dt);
    monday.setDate(dt.getDate() - day + 1);
    const weekKey = monday.toISOString().slice(0,10);
    if (!weekSet.has(weekKey)) {
      weekSet.add(weekKey);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      weeks.push({ start: weekKey, end: sunday.toISOString().slice(0,10), label: weekKey.slice(5) + ' ~ ' + sunday.toISOString().slice(5,10) });
    }
  });
  weeks.reverse();
  
  select.innerHTML = weeks.map((w, i) => `<option value="${i}">${w.label}</option>`).join('');
  
  // 默认上个自然周
  const defaultWeek = weeks.length > 1 ? 1 : 0;
  select.value = defaultWeek;
  select.onchange = renderWeekRankContent;
  renderWeekRankContent();
}

function renderWeekRankContent() {
  const select = document.getElementById('weekRankSelect');
  const weekIdx = parseInt(select.value);
  const dates = [...new Set(ANCHOR.filter(r => r.date).map(r => r.date))].sort();
  const weeks = [];
  const weekSet = new Set();
  dates.forEach(d => {
    const dt = new Date(d);
    const day = dt.getDay() || 7;
    const monday = new Date(dt);
    monday.setDate(dt.getDate() - day + 1);
    const weekKey = monday.toISOString().slice(0,10);
    if (!weekSet.has(weekKey)) {
      weekSet.add(weekKey);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      weeks.push({ start: weekKey, end: sunday.toISOString().slice(0,10) });
    }
  });
  weeks.reverse();
  
  const week = weeks[weekIdx];
  const weekData = ANCHOR.filter(r => r.date && r.date >= week.start && r.date <= week.end);
  
  const anchorMap = {};
  weekData.forEach(r => {
    const name = r.anchor || '未知';
    if (!anchorMap[name]) anchorMap[name] = { name, totalGmv:0, totalSpend:0, totalDuration:0, sessions:0, hourlyGmv:0, overallRoi:0 };
    anchorMap[name].totalGmv += r.totalGmv || 0;
    anchorMap[name].totalSpend += r.adSpend || 0;
    anchorMap[name].totalDuration += r.duration || 0;
    anchorMap[name].sessions += r.sessions || 1;
  });
  
  const list = Object.values(anchorMap);
  list.forEach(r => {
    r.hourlyGmv = r.totalDuration > 0 ? r.totalGmv / r.totalDuration : 0;
    r.overallRoi = r.totalSpend > 0 ? r.totalGmv / r.totalSpend : 0;
    r.score = r.hourlyGmv * 0.4 + r.overallRoi * 1000 * 0.3 + r.totalGmv * 0.001 * 0.3;
  });
  list.sort((a,b) => b.score - a.score);
  
  document.getElementById('weekRankLabel').textContent = week.start + ' ~ ' + week.end;
  const container = document.getElementById('weekRankList');
  if (!list.length) { container.innerHTML = '<div class="text-center text-slate-400 py-8 text-sm">暂无数据</div>'; return; }
  
  container.innerHTML = list.map((r, i) => {
    const rankColors = ['#fbbf24','#94a3b8','#cd7f32','#60a5fa','#60a5fa'];
    const rankColor = rankColors[i] || '#94a3b8';

// 主播数据表格
const table2State = { search:'', page:1, pageSize:10, sortKey:'', sortDir:'asc' };
const table2Cols = [
  {key:'date',label:'日期'},
  {key:'anchor',label:'主播'},
  {key:'totalGmv',label:'总GMV'},
  {key:'adSpend',label:'投放消耗'},
  {key:'overallRoi',label:'整体ROI'},
  {key:'duration',label:'直播时长(h)'},
  {key:'hourlyGmv',label:'小时均GMV'},
  {key:'views',label:'场观'},
  {key:'orders',label:'成交件数'}
];

function renderAnchorTable() {
  let data = [...ANCHOR];
  if (table2State.search) {
    const q = table2State.search.toLowerCase();
    data = data.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q)));
  }
  if (table2State.sortKey) {
    data.sort((a,b) => {
      const va = a[table2State.sortKey] || 0;
      const vb = b[table2State.sortKey] || 0;
      return table2State.sortDir === 'asc' ? va - vb : vb - va;
    });
  }
  
  const total = data.length;
  const totalPages = Math.ceil(total / table2State.pageSize);
  const start = (table2State.page - 1) * table2State.pageSize;
  const pageData = data.slice(start, start + table2State.pageSize);
  
  const thead = document.querySelector('#table2 thead');
  thead.innerHTML = '<tr>' + table2Cols.map(c => {
    const sortIcon = table2State.sortKey === c.key ? (table2State.sortDir === 'asc' ? ' ↑' : ' ↓') : '';
    return '<th class="px-3 py-2 text-left cursor-pointer" data-key="' + c.key + '">' + c.label + sortIcon + '</th>';
  }).join('') + '</tr>';
  
  thead.querySelectorAll('th').forEach(th => {
    th.onclick = () => {
      const key = th.dataset.key;
      if (table2State.sortKey === key) {
        table2State.sortDir = table2State.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        table2State.sortKey = key;
        table2State.sortDir = 'asc';
      }
      renderAnchorTable();
    };
  });
  
  const tbody = document.querySelector('#table2 tbody');
  tbody.innerHTML = pageData.map(r => '<tr class="border-b border-slate-100">' + table2Cols.map(c => {
    let val = r[c.key];
    if (c.key === 'totalGmv' || c.key === 'adSpend' || c.key === 'hourlyGmv') val = fmt.money(val);
    else if (c.key === 'overallRoi') val = fmt.num(val);
    return '<td class="px-3 py-2">' + (val || '-') + '</td>';
  }).join('') + '</tr>').join('');
  
  const pag = document.getElementById('pagination2');
  pag.innerHTML = '<span>共 ' + total + ' 条</span><div class="flex gap-1">' + 
    Array.from({length: totalPages}, (_, i) => '<button class="px-2 py-1 rounded ' + (i+1 === table2State.page ? 'active' : '') + '" onclick="table2State.page=' + (i+1) + ';renderAnchorTable()">' + (i+1) + '</button>').join('') + 
    '</div>';
}

    yAxis: [{type:'value',name:'点击率',axisLabel:{formatter:'{value}%'}},{type:'value',name:'ROI'}],
    series: [
      {name:'商品曝光点击率',type:'bar',data:data.map(r=>(r.productClickRate*100).toFixed(2)),itemStyle:{color:'#2563eb'}, label:{show:true,position:'top',fontSize:10,formatter:'{c}%'}},
      {name:'ROI',type:'line',yAxisIndex:1,smooth:true,data:data.map(r=>r.overallRoi),itemStyle:{color:'#16a34a'}, label:{show:true,position:'top',fontSize:10}}
    ]
  });
  
  // GMV & 点击成交转化率走势
  getChart('chartDimensionGmvConv').setOption({
    tooltip: {trigger:'axis'},
    legend: {data:['GMV','点击成交转化率'], bottom:0},
    grid: {left:'3%',right:'4%',bottom:'15%',containLabel:true},
    xAxis: {type:'category',data:dates},
    yAxis: [{type:'value',name:'GMV'},{type:'value',name:'转化率',axisLabel:{formatter:'{value}%'}}],
    series: [
      {name:'GMV',type:'bar',data:data.map(r=>r.totalGmv),itemStyle:{color:'#003087'}, label:{show:true,position:'top',fontSize:10}},
      {name:'点击成交转化率',type:'line',yAxisIndex:1,smooth:true,data:data.map(r=>(r.clickToBuyRate*100).toFixed(2)),itemStyle:{color:'#c8102e'}, label:{show:true,position:'top',fontSize:10,formatter:'{c}%'}}
    ]
  });
  
  // 直播间场观 & ROI走势
  getChart('chartDimensionViewsRoi').setOption({
    tooltip: {trigger:'axis'},
    legend: {data:['场观','ROI'], bottom:0},
    grid: {left:'3%',right:'4%',bottom:'15%',containLabel:true},
    xAxis: {type:'category',data:dates},
    yAxis: [{type:'value',name:'场观'},{type:'value',name:'ROI'}],
    series: [
      {name:'场观',type:'bar',data:data.map(r=>r.views),itemStyle:{color:'#9333ea'}, label:{show:true,position:'top',fontSize:10}},
      {name:'ROI',type:'line',yAxisIndex:1,smooth:true,data:data.map(r=>r.overallRoi),itemStyle:{color:'#16a34a'}, label:{show:true,position:'top',fontSize:10}}
    ]
  });
  
  // 数据总结
  const label = document.getElementById('dimensionAnalysisLabel');
  const content = document.getElementById('dimensionAnalysisContent');
  if (!data || !data.length) {
    label.textContent = '';
    content.innerHTML = '<div class="text-slate-400 text-center py-4">所选区间暂无数据</div>';
    return;
  }
  const startDate = data[0].date, endDate = data[data.length-1].date;
  const days = data.length;
  label.textContent = startDate + ' ~ ' + endDate + '（' + days + '天）';
  
  const totalGmv = data.reduce((s,r)=>s+(r.totalGmv||0),0);
  const avgGmv = totalGmv/days;
  const maxGmvRow = data.reduce((a,b)=>(a.totalGmv||0)>(b.totalGmv||0)?a:b);
  const totalSpend = data.reduce((s,r)=>s+(r.adSpend||0),0);
  const avgRoi = totalSpend>0? totalGmv/totalSpend : 0;
  const totalOrders = data.reduce((s,r)=>s+(r.orders||0),0);
  const avgViews = data.reduce((s,r)=>s+(r.views||0),0)/days;
  const totalRefund = data.reduce((s,r)=>s+(r.refundAmount||0),0);
  const refundRate = totalGmv>0? totalRefund/totalGmv : 0;
  
  const totalExpSum = data.reduce((s,r)=>s+(r.exposureCount||0),0);
  const totalWatchSum = data.reduce((s,r)=>s+(r.watchCount||0),0);
  const totalClickSum = data.reduce((s,r)=>s+(r.productClickCount||0),0);
  const totalBuyerSum = data.reduce((s,r)=>s+(r.buyerCount||0),0);
  const exp2watch = totalExpSum? totalWatchSum/totalExpSum : 0;
  const click2buy = totalClickSum? totalBuyerSum/totalClickSum : 0;
  
  const half = Math.floor(days/2);
  const firstHalf = data.slice(0, half).reduce((s,r)=>s+(r.totalGmv||0),0);
  const secondHalf = data.slice(half).reduce((s,r)=>s+(r.totalGmv||0),0);
  const trend = secondHalf > firstHalf*1.05 ? '上升' : secondHalf < firstHalf*0.95 ? '下降' : '平稳';
  
  content.innerHTML = `
    <p><span class="font-semibold" style="color:#003087">【经营概况】</span>统计区间共 ${days} 天，总GMV <span class="font-bold" style="color:#003087">${fmt.money(totalGmv)}</span>，日均 <span class="font-bold">${fmt.money(avgGmv)}</span>；单日最高 ${maxGmvRow.date} 达 ${fmt.money(maxGmvRow.totalGmv)}。总投放消耗 ${fmt.money(totalSpend)}，整体ROI <span class="font-bold" style="color:${avgRoi>=2?'#16a34a':'#c8102e'}">${fmt.num(avgRoi)}</span>。</p>
    <p><span class="font-semibold" style="color:#003087">【流量转化】</span>累计曝光 ${fmt.int(totalExp)} 人，观看 ${fmt.int(totalWatch)} 人，曝光-观看率 <span class="font-bold">${fmt.pct(exp2watch)}</span>；商品点击 ${fmt.int(totalClick)} 人，点击-成交转化率 <span class="font-bold">${fmt.pct(click2buy)}</span>；累计成交 ${fmt.int(totalBuyer)} 人、${totalOrders} 件。</p>
    <p><span class="font-semibold" style="color:#003087">【趋势研判】</span>区间后半段GMV较前半段呈<span class="font-bold" style="color:${trend==='上升'?'#16a34a':trend==='下降'?'#c8102e':'#d4a574'}">${trend}</span>态势。场均场观 ${fmt.int(avgViews)} 人，退款率 <span class="font-bold" style="color:${refundRate<=0.05?'#16a34a':'#c8102e'}">${fmt.pct(refundRate)}</span>${refundRate>0.05?'，建议关注退款原因。':'，控制良好。'}</p>
    <p><span class="font-semibold" style="color:#003087">【运营建议】</span>${avgRoi<2?'当前整体ROI低于2，建议优化投放人群和素材，提升投产比。':'整体ROI表现良好，可考虑适度加大投放预算。'} ${exp2watch<0.15?'曝光-观看率偏低，建议优化直播间封面和标题提升吸引力。':'曝光-观看率达标。'} ${click2buy<0.15?'点击-成交转化率有提升空间，建议优化商品讲解和促单话术。':'点击-成交转化表现优秀。'}</p>
  `;
}

// ==================== 截图功能 ====================
function takeScreenshot() {
  const btn = document.getElementById('screenshotBtn');
  btn.disabled = true;
  btn.textContent = '截图中...';
  html2canvas(document.body, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#667eea'
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = '桂格直播间数据看板_' + new Date().toISOString().slice(0,10) + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.disabled = false;
    btn.textContent = '一键截图';
  }).catch(err => {
    console.error('截图失败:', err);
    btn.disabled = false;
    btn.textContent = '一键截图';
    alert('截图失败，请重试');
  });
}

function takeCardScreenshot(target) {
  // 找到对应的卡片容器
  const btn = event.target;
  const card = btn.closest('.card-container');
  if (!card) return;
  
  const originalText = btn.textContent;
  btn.textContent = '截图中...';
  btn.disabled = true;
  
  html2canvas(card, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#ffffff'
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = target + '_' + new Date().toISOString().slice(0,10) + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.textContent = originalText;
    btn.disabled = false;
  }).catch(err => {
    console.error('截图失败:', err);
    btn.textContent = originalText;
    btn.disabled = false;
    alert('截图失败，请重试');
  });
}

document.getElementById('tab1Btn').onclick = () => switchTab(1);
document.getElementById('tab2Btn').onclick = () => switchTab(2);
document.getElementById('tab3Btn').onclick = () => switchTab(3);

// 初始化
window.addEventListener('load', function() {
  renderAll();
});
</script>
