<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桂格直播间运营数据看板</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #F4EFE6;
  --card-bg: #FFFFFF;
  --card-border: #E8E0D5;
  --text-primary: #1A1A2E;
  --text-secondary: #6B7280;
  --text-muted: #9CA3AF;
  --blue: #2563EB;
  --blue-light: #DBEAFE;
  --orange: #F97316;
  --orange-light: #FFEDD5;
  --green: #10B981;
  --green-light: #D1FAE5;
  --red: #EF4444;
  --red-light: #FEE2E2;
  --purple: #8B5CF6;
  --purple-light: #EDE9FE;
  --gold: #F59E0B;
  --gold-light: #FEF3C7;
  --section-blue: #1E40AF;
  --section-red: #DC2626;
  --section-green: #059669;
  --section-purple: #7C3AED;
  --section-gold: #D97706;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 16px;
  font-size: 14px;
  line-height: 1.5;
}

.container {
  max-width: 1440px;
  margin: 0 auto;
}

/* ===== Header ===== */
.header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.header-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
}

.date-selector {
  display: flex;
  align-items: center;
  gap: 8px;
}

.date-selector label {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
}

.date-selector select, .date-selector input {
  padding: 6px 12px;
  border: 1px solid var(--card-border);
  border-radius: 6px;
  font-size: 13px;
  background: white;
  color: var(--text-primary);
  cursor: pointer;
  font-family: inherit;
}

.date-selector select:focus, .date-selector input:focus {
  outline: none;
  border-color: var(--blue);
}

.update-time {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-muted);
}

/* ===== Section Card ===== */
.section {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 16px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.section-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 700;
  color: white;
}

.section-badge.blue { background: var(--section-blue); }
.section-badge.red { background: var(--section-red); }
.section-badge.green { background: var(--section-green); }
.section-badge.purple { background: var(--section-purple); }
.section-badge.gold { background: var(--section-gold); }

.section-date {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
}

.section-icon {
  margin-left: auto;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 12px;
}

/* ===== Monthly Targets ===== */
.monthly-targets {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.target-card {
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 16px 20px;
  position: relative;
}

.target-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.target-input {
  width: 60px;
  padding: 2px 6px;
  border: 1px solid var(--card-border);
  border-radius: 4px;
  font-size: 12px;
  text-align: center;
  font-family: inherit;
}

.target-value {
  font-size: 28px;
  font-weight: 900;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}

.target-value.blue { color: var(--blue); }
.target-value.orange { color: var(--orange); }
.target-value.green { color: var(--green); }

.target-diff {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.target-diff .diff-val {
  font-weight: 600;
}

.progress-bar {
  height: 8px;
  background: #F3F4F6;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 8px;
}

.progress-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s ease;
}

.progress-fill.blue { background: linear-gradient(90deg, #3B82F6, #2563EB); }
.progress-fill.orange { background: linear-gradient(90deg, #FB923C, #F97316); }
.progress-fill.green { background: linear-gradient(90deg, #34D399, #10B981); }

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
}

.progress-info .ahead {
  color: var(--green);
  font-weight: 600;
}

.progress-info .behind {
  color: var(--red);
  font-weight: 600;
}

/* ===== Daily Core Metrics ===== */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}

.metric-card {
  border: 1px solid var(--card-border);
  border-radius: 8px;
  padding: 12px 14px;
  background: linear-gradient(135deg, #FFFEFC 0%, #FDFBF7 100%);
}

.metric-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 6px;
  font-weight: 500;
}

.metric-value {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.metric-value.blue { color: var(--blue); }
.metric-value.orange { color: var(--orange); }
.metric-value.green { color: var(--green); }
.metric-value.red { color: var(--red); }
.metric-value.purple { color: var(--purple); }
.metric-value.gold { color: var(--gold); }
.metric-value.dark { color: var(--text-primary); }

.metric-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ===== Two Column Layout ===== */
.two-col {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

.two-col.equal {
  grid-template-columns: 1fr 1fr;
}

/* ===== Funnel Chart ===== */
.funnel-container {
  display: flex;
  gap: 20px;
  align-items: stretch;
}

.funnel-chart {
  flex: 1;
  height: 320px;
}

.funnel-targets {
  width: 200px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.funnel-target-item {
  padding: 8px 12px;
  border-radius: 6px;
  background: #FAFAF9;
  border: 1px solid var(--card-border);
}

.funnel-target-label {
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.funnel-target-value {
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.funnel-target-value .rate {
  font-size: 13px;
}

.funnel-target-value .target {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
}

.status-pass { color: var(--green); }
.status-fail { color: var(--red); }

.funnel-overall {
  margin-top: 8px;
  padding: 6px 12px;
  background: var(--blue-light);
  border-radius: 6px;
  text-align: center;
  font-size: 12px;
  color: var(--blue);
  font-weight: 600;
}

/* ===== Anchor Ranking ===== */
.ranking-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.ranking-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  background: #FCFBF9;
}

.ranking-num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 900;
  color: white;
  flex-shrink: 0;
}

.ranking-num.gold { background: linear-gradient(135deg, #FBBF24, #F59E0B); }
.ranking-num.silver { background: linear-gradient(135deg, #9CA3AF, #6B7280); }
.ranking-num.bronze { background: linear-gradient(135deg, #D97706, #B45309); }

.ranking-name {
  font-size: 15px;
  font-weight: 700;
  width: 70px;
  flex-shrink: 0;
}

.ranking-stats {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.ranking-stat {
  text-align: center;
}

.ranking-stat-label {
  font-size: 10px;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.ranking-stat-value {
  font-size: 13px;
  font-weight: 700;
}

.ranking-stat-value.blue { color: var(--blue); }
.ranking-stat-value.green { color: var(--green); }
.ranking-stat-value.orange { color: var(--orange); }
.ranking-stat-value.dark { color: var(--text-primary); }

/* ===== Schedule ===== */
.schedule-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.schedule-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 6px;
  border-left: 3px solid;
}

.schedule-item.today { background: #FEF2F2; border-left-color: var(--red); }
.schedule-item.tomorrow { background: #EFF6FF; border-left-color: var(--blue); }

.schedule-time {
  font-size: 13px;
  font-weight: 700;
  width: 80px;
  flex-shrink: 0;
}

.schedule-item.today .schedule-time { color: var(--red); }
.schedule-item.tomorrow .schedule-time { color: var(--blue); }

.schedule-anchor {
  font-size: 14px;
  font-weight: 600;
  flex: 1;
}

.schedule-duration {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}

.schedule-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--card-border);
  font-size: 12px;
  color: var(--text-muted);
}

.schedule-footer .total {
  font-weight: 700;
  font-size: 13px;
}

.schedule-footer .total.red { color: var(--red); }
.schedule-footer .total.blue { color: var(--blue); }

/* ===== Data Analysis ===== */
.analysis-section {
  padding: 0;
  overflow: hidden;
}

.analysis-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--card-border);
}

.analysis-block {
  padding: 12px 20px;
  border-bottom: 1px solid #F3F4F6;
}

.analysis-block:last-child {
  border-bottom: none;
}

.analysis-block-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
}

.analysis-block-title .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.analysis-block-title .dot.blue { background: var(--blue); }
.analysis-block-title .dot.red { background: var(--red); }
.analysis-block-title .dot.gold { background: var(--gold); }
.analysis-block-title .dot.green { background: var(--green); }

.analysis-block.blue-bg { background: #F0F7FF; }
.analysis-block.red-bg { background: #FFF5F5; }
.analysis-block.gold-bg { background: #FFFBF0; }
.analysis-block.green-bg { background: #F0FDF4; }

.analysis-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
}

.analysis-text strong {
  color: var(--text-primary);
  font-weight: 700;
}

.analysis-text .val-blue { color: var(--blue); font-weight: 700; }
.analysis-text .val-orange { color: var(--orange); font-weight: 700; }
.analysis-text .val-green { color: var(--green); font-weight: 700; }
.analysis-text .val-red { color: var(--red); font-weight: 700; }

/* ===== Empty State ===== */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

/* ===== Loading ===== */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 400px;
  font-size: 16px;
  color: var(--text-secondary);
}

.loading-spinner {
  width: 24px;
  height: 24px;
  border: 3px solid var(--card-border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 12px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===== Responsive ===== */
@media (max-width: 1200px) {
  .metrics-grid { grid-template-columns: repeat(4, 1fr); }
  .ranking-stats { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 900px) {
  .monthly-targets { grid-template-columns: 1fr; }
  .metrics-grid { grid-template-columns: repeat(3, 1fr); }
  .two-col, .two-col.equal { grid-template-columns: 1fr; }
  .funnel-container { flex-direction: column; }
  .funnel-targets { width: 100%; flex-direction: row; flex-wrap: wrap; }
  .funnel-target-item { flex: 1; min-width: 140px; }
}

@media (max-width: 600px) {
  body { padding: 8px; }
  .metrics-grid { grid-template-columns: repeat(2, 1fr); }
  .ranking-stats { grid-template-columns: repeat(2, 1fr); }
  .target-value { font-size: 22px; }
  .metric-value { font-size: 18px; }
  .header { flex-direction: column; align-items: flex-start; }
  .update-time { margin-left: 0; }
}
</style>
</head>
<body>
<div class="container">
  <div id="app">
    <div class="loading">
      <div class="loading-spinner"></div>
      <span>数据加载中...</span>
    </div>
  </div>
</div>

<script>
// ===== 全局状态 =====
let allData = null;
let currentDate = null;
let funnelChart = null;

// 月度目标（可编辑）
let monthlyTargets = {
  gmv: 100,      // 万元
  adSpend: 50,   // 万元
  roi: 2.2
};

// 漏斗转化率目标
const funnelTargets = {
  exposureWatch: 15,    // 曝光-观看率 %
  watchProduct: 80,     // 观看-商品曝光率 %
  productClick: 25,     // 商品曝光-点击率 %
  clickBuy: 15          // 点击-成交转化率 %
};

// ===== 工具函数 =====
function formatNumber(num, decimals = 0) {
  if (num === null || num === undefined || isNaN(num)) return '—';
  return Number(num).toLocaleString('zh-CN', {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  });
}

function formatMoney(num, unit = '元') {
  if (num === null || num === undefined || isNaN(num)) return '—';
  if (num >= 10000) {
    return (num / 10000).toFixed(2) + '万';
  }
  return formatNumber(num, 2) + unit;
}

function formatPercent(num, decimals = 2) {
  if (num === null || num === undefined || isNaN(num)) return '—';
  return (num * 100).toFixed(decimals) + '%';
}

function formatDateCN(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  return `${d.getMonth() + 1}月${d.getDate()}日 ${weekdays[d.getDay()]}`;
}

function getDayRecord(dateStr) {
  if (!allData || !allData.records) return null;
  return allData.records.find(r => r.date === dateStr) || null;
}

function getMonthRecords(year, month) {
  if (!allData || !allData.records) return [];
  const prefix = `${year}-${String(month).padStart(2, '0')}`;
  return allData.records.filter(r => r.date.startsWith(prefix));
}

// ===== 渲染主函数 =====
function render() {
  const app = document.getElementById('app');
  if (!allData) {
    app.innerHTML = '<div class="empty-state">暂无数据</div>';
    return;
  }

  const latest = allData.latest;
  if (!currentDate) currentDate = latest.date;
  const dayData = getDayRecord(currentDate);

  if (!dayData) {
    app.innerHTML = '<div class="empty-state">所选日期无数据</div>';
    return;
  }

  const dateObj = new Date(currentDate);
  const monthRecords = getMonthRecords(dateObj.getFullYear(), dateObj.getMonth() + 1);
  const monthly = calcMonthly(monthRecords);

  app.innerHTML = `
    ${renderHeader()}
    ${renderMonthlyTargets(monthly, monthRecords.length)}
    ${renderDailyMetrics(dayData)}
    ${renderFunnelAndRanking(dayData)}
    ${renderSchedule()}
    ${renderAnalysis(dayData, monthly)}
  `;

  // 初始化漏斗图
  setTimeout(() => initFunnelChart(dayData), 100);

  // 绑定事件
  bindEvents();
}

function calcMonthly(records) {
  const total_gmv = records.reduce((s, r) => s + (r.total_gmv || 0), 0);
  const gmv = records.reduce((s, r) => s + (r.gmv || 0), 0);
  const ad_spend = records.reduce((s, r) => s + (r.ad_spend || 0), 0);
  const duration = records.reduce((s, r) => s + (r.duration || 0), 0);
  const views = records.reduce((s, r) => s + (r.views || 0), 0);
  const orders = records.reduce((s, r) => s + (r.orders || 0), 0);
  const new_followers = records.reduce((s, r) => s + (r.new_followers || 0), 0);
  const refund_amount = records.reduce((s, r) => s + (r.refund_amount || 0), 0);
  return {
    total_gmv, gmv, ad_spend, duration, views, orders, new_followers, refund_amount,
    roi: ad_spend > 0 ? gmv / ad_spend : 0,
    refund_rate: total_gmv > 0 ? refund_amount / total_gmv : 0
  };
}

// ===== Header =====
function renderHeader() {
  const dates = allData.records.map(r => r.date).reverse();
  const options = dates.map(d => `<option value="${d}" ${d === currentDate ? 'selected' : ''}>${formatDateCN(d)}</option>`).join('');
  return `
    <div class="header">
      <div class="header-title">桂格直播间运营数据看板</div>
      <div class="date-selector">
        <label>选择日期:</label>
        <select id="dateSelect">${options}</select>
      </div>
      <div class="update-time">数据更新: ${allData.updated_at || '—'}</div>
    </div>
  `;
}

// ===== Monthly Targets =====
function renderMonthlyTargets(monthly, daysElapsed) {
  const daysInMonth = new Date(new Date(currentDate).getFullYear(), new Date(currentDate).getMonth() + 1, 0).getDate();
  const timeProgress = (daysElapsed / daysInMonth) * 100;

  // GMV
  const gmvTarget = monthlyTargets.gmv * 10000;
  const gmvProgress = Math.min((monthly.total_gmv / gmvTarget) * 100, 100);
  const gmvDiff = gmvTarget - monthly.total_gmv;
  const gmvAhead = gmvProgress - timeProgress;

  // 消耗
  const spendTarget = monthlyTargets.adSpend * 10000;
  const spendProgress = Math.min((monthly.ad_spend / spendTarget) * 100, 100);
  const spendDiff = spendTarget - monthly.ad_spend;
  const spendAhead = spendProgress - timeProgress;

  // ROI
  const roiTarget = monthlyTargets.roi;
  const roiStatus = monthly.roi >= roiTarget;

  return `
    <div class="section">
      <div class="section-header">
        <span class="section-badge blue">本月经营目标</span>
        <span class="section-date">${new Date(currentDate).getFullYear()}年${new Date(currentDate).getMonth() + 1}月（共${daysElapsed}天）</span>
        <span class="section-icon">⚙</span>
      </div>
      <div class="monthly-targets">
        <div class="target-card">
          <div class="target-label">
            本月GMV
            <span>目标 <input type="number" class="target-input" id="targetGmv" value="${monthlyTargets.gmv}" /> 万</span>
          </div>
          <div class="target-value blue">¥${formatNumber(monthly.total_gmv, 2)}</div>
          <div class="target-diff">差 <span class="diff-val">${gmvDiff > 0 ? formatNumber(gmvDiff, 0) : '已达标'}</span></div>
          <div class="progress-bar"><div class="progress-fill blue" style="width:${gmvProgress}%"></div></div>
          <div class="progress-info">
            <span>完成 ${gmvProgress.toFixed(1)}% · 时序 ${timeProgress.toFixed(1)}%</span>
            <span class="${gmvAhead >= 0 ? 'ahead' : 'behind'}">${gmvAhead >= 0 ? '超前' : '落后'} ${Math.abs(gmvAhead).toFixed(1)}%</span>
          </div>
        </div>
        <div class="target-card">
          <div class="target-label">
            本月消耗
            <span>目标 <input type="number" class="target-input" id="targetSpend" value="${monthlyTargets.adSpend}" /> 万</span>
          </div>
          <div class="target-value orange">¥${formatNumber(monthly.ad_spend, 1)} <span style="font-size:14px;font-weight:500;color:var(--green)">✓ 达标</span></div>
          <div class="target-diff">&nbsp;</div>
          <div class="progress-bar"><div class="progress-fill orange" style="width:${spendProgress}%"></div></div>
          <div class="progress-info">
            <span>完成 ${spendProgress.toFixed(1)}% · 时序 ${timeProgress.toFixed(1)}%</span>
            <span class="${spendAhead <= 0 ? 'ahead' : 'behind'}">${spendAhead <= 0 ? '节余' : '超支'} ${Math.abs(spendAhead).toFixed(1)}%</span>
          </div>
        </div>
        <div class="target-card">
          <div class="target-label">
            本月投产ROI
            <span>目标 <input type="number" class="target-input" id="targetRoi" value="${monthlyTargets.roi}" step="0.1" /></span>
          </div>
          <div class="target-value green">${monthly.roi.toFixed(2)} <span style="font-size:14px;font-weight:500;color:var(--text-secondary)">差${(roiTarget - monthly.roi).toFixed(2)}</span></div>
          <div class="target-diff">&nbsp;</div>
          <div class="progress-bar"><div class="progress-fill green" style="width:${Math.min((monthly.roi / roiTarget) * 100, 100)}%"></div></div>
          <div class="progress-info">
            <span>完成 ${((monthly.roi / roiTarget) * 100).toFixed(1)}% · 时序 ${timeProgress.toFixed(1)}%</span>
            <span class="${roiStatus ? 'ahead' : 'behind'}">${roiStatus ? '超前' : '落后'} ${Math.abs((monthly.roi / roiTarget * 100) - timeProgress).toFixed(1)}%</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ===== Daily Core Metrics =====
function renderDailyMetrics(d) {
  const metrics = [
    { label: '总GMV', value: '¥' + formatNumber(d.total_gmv, 2), sub: '加优惠券', color: 'dark' },
    { label: 'GMV', value: '¥' + formatNumber(d.gmv, 2), sub: '不含优惠券', color: 'blue' },

    { label: '整体ROI', value: d.roi ? d.roi.toFixed(2) : '—', sub: '投产比', color: 'green' },
    { label: '直播时长', value: (d.duration || 0).toFixed(1) + 'h', sub: '小时', color: 'dark' },
    { label: '小时均GMV', value: '¥' + formatNumber(d.hourly_gmv, 0), sub: '每小时产出', color: 'blue' },

    { label: '客单价', value: '¥' + formatNumber(d.aov, 2), sub: '件均金额', color: 'dark' },

    { label: '退款率', value: formatPercent(d.refund_rate, 2), sub: '退款占比', color: 'red' },
    { label: '商品曝光点击率', value: formatPercent(d.product_click_rate, 2), sub: '商品点击/曝光', color: 'purple' },

  const cards = metrics.map(m => `

  return `

      <div class="section-header">
        <span class="section-badge blue">当日核心数据</span>
        <span class="section-date">${currentDate}</span>
        <span class="section-icon">⌂</span>
      </div>
      <div class="metrics-grid">${cards}</div>
    </div>
  `;
}

        </div>
      </div>
      <div class="analysis-block gold-bg">
        <div class="analysis-block-title"><span class="dot gold"></span>主播表现</div>
        <div class="analysis-text">
          当日共 3 位主播开播，GMV最高为 <strong>朱吴琪</strong>（¥12,500，占比 45%），ROI 2.21，小时均GMV ¥2,778。主播梯队分布合理，建议保持头部主播优势的同时培养腰部主播。
        </div>
      </div>
      <div class="analysis-block green-bg">
        <div class="analysis-block-title"><span class="dot green"></span>运营建议</div>
        <div class="analysis-text">

// ===== Funnel Chart =====
function initFunnelChart(d) {
  const el = document.getElementById('funnelChart');
  if (!el || typeof echarts === 'undefined') return;

  if (funnelChart) funnelChart.dispose();
  funnelChart = echarts.init(el);

  const data = [
    { value: d.exposure || 0, name: '直播间曝光\n' + formatNumber(d.exposure, 0) + '人' },
    { value: d.watchers || 0, name: '直播间观看\n' + formatNumber(d.watchers, 0) + '人' },
    { value: d.product_exposure || 0, name: '商品曝光\n' + formatNumber(d.product_exposure, 0) + '人' },
    { value: d.product_clicks || 0, name: '商品点击\n' + formatNumber(d.product_clicks, 0) + '人' },
    { value: d.buyers || 0, name: '成交\n' + formatNumber(d.buyers, 0) + '人' },
  ];

  const option = {
    tooltip: {
      trigger: 'item',
      formatter: '{b}'
    },
    series: [{
      type: 'funnel',
      left: '5%',
      top: 10,
      bottom: 10,
      width: '80%',
      min: 0,
      max: d.exposure || 100,
      minSize: '20%',
      maxSize: '100%',
      sort: 'descending',
      gap: 4,
      label: {
        show: true,
        position: 'inside',
        fontSize: 12,
        fontWeight: 600,
        color: '#fff',
        formatter: function(params) {
          return params.name;
        }
      },
      labelLine: { show: false },
      itemStyle: {
        borderColor: '#fff',
        borderWidth: 1
      },
      emphasis: {
        label: { fontSize: 14 }
      },
      data: data,
      color: ['#3B82F6', '#2563EB', '#1D4ED8', '#1E40AF', '#1E3A8A']
    }]
  };

  funnelChart.setOption(option);
  window.addEventListener('resize', () => funnelChart && funnelChart.resize());
}

// ===== Event Binding =====
function bindEvents() {
  const dateSelect = document.getElementById('dateSelect');
  if (dateSelect) {
    dateSelect.addEventListener('change', function() {
      currentDate = this.value;
      render();
    });
  }

  const targetGmv = document.getElementById('targetGmv');
  if (targetGmv) {
    targetGmv.addEventListener('change', function() {
      monthlyTargets.gmv = parseFloat(this.value) || 100;
      render();
    });
  }

  const targetSpend = document.getElementById('targetSpend');
  if (targetSpend) {
    targetSpend.addEventListener('change', function() {
      monthlyTargets.adSpend = parseFloat(this.value) || 50;
      render();
    });
  }

  const targetRoi = document.getElementById('targetRoi');
  if (targetRoi) {
    targetRoi.addEventListener('change', function() {
      monthlyTargets.roi = parseFloat(this.value) || 2.2;
      render();
    });
  }
}

// ===== 数据加载 =====
async function loadData() {
  try {
    const resp = await fetch('data.json?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    allData = await resp.json();
    render();
  } catch (e) {
    console.error('加载数据失败:', e);
    document.getElementById('app').innerHTML = `
      <div class="empty-state">
        <p>数据加载失败: ${e.message}</p>
        <p style="margin-top:8px;font-size:12px;">请确认 data.json 文件存在且可访问</p>
      </div>
    `;
  }
}

// 启动
loadData();
</script>
